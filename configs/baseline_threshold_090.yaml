# Fast smoke-test config.
# Use this first to check that the whole workflow runs correctly on a CPU laptop.

experiment:
  name: baseline_quick
  seed: 42
  deterministic: true
  device: cpu
  num_workers: 0
  notes: "Quick digits benchmark for validating the pipeline."

dataset:
  name: digits
  track: domain_agnostic
  # Digits is built into sklearn, so it is the easiest zero-friction benchmark.
  auto_download: true
  cache_processed: true
  val_split: 0.15
  test_size: 0.20

models:
  names:
    - linear
    - mlp
    - cnn

training:
  epochs: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 64
  early_stopping_patience: 2

benchmark:
  split: test
  batch_sizes: [1, 8, 32]
  primary_batch_size: 8
  warmup_batches: 1
  repetitions: 2
  track_memory: true

offload:
  enabled: true
  edge_model: linear
  cloud_model: cnn
  hybrid_secondary_model: null
  confidence_threshold: 0.90
  network:
    uplink_mbps: 12.0
    downlink_mbps: 40.0
    round_trip_ms: 30.0
    server_processing_ms: 12.0
    response_bytes: 128
    use_measured_cloud_inference: false

analysis:
  poster_title: "CPU-Friendly Edge AI Pipeline Benchmarking"
  motivation: "Quick reproducible benchmark of full edge AI pipelines on CPU-only hardware."
  finding_count: 4
